header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--cd);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}main{max-width:960px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}

.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}

.cm{border-left:3px solid var(--bd);padding-left:8px;margin:4px 0;font-size:14px}

#toast div{background:var(--tx);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px}
img.at{max-width:160px;border-radius:8px;display:block;margin-top:6px}details{margin:6px 0}

"routed to":"को भेजा गया","is now":"अब","New comment on":"नई टिप्पणी:","unresolved past deadline, escalated to admin":"समय सीमा पार, एडमिन को भेजा गया"}};
const TABS={student:["file","mine","feed","faq"],staff:["queue","feed","faq"],admin:["queue","stats","audit","feed","faq"]};
const STAFF=["Unassigned","Mr. Rao","Ms. Devi","Mr. Khan"],STS=["Submitted","In Progress","Resolved"],PRI=["Low","Medium","High"],DAY=864e5,K="mru_cms_v1";
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const H=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(16).padStart(8,"0")};
let S,F={q:"",st:"",cat:""},tab="",showN=0,draft={};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S){const n=Date.now();S={n:1004,off:0,lang:"en",theme:"",sms:0,me:null,pts:{},notes:[],audit:[],tickets:[
{id:"MRU-1001",cat:"Mess",dept:CATS.Mess,desc:"Dinner rice was undercooked in Block B mess for three days.",loc:"Block B, Ground, Mess",pri:"Medium",anon:0,by:"22K41A0577",at:n-DAY*1.2,status:"In Progress",asg:"Ms. Devi",ups:["a","b"],cm:[],fb:null},
{id:"MRU-1002",cat:"Infrastructure",dept:CATS.Infrastructure,desc:"Ceiling fan not working in the room, very hot at night.",loc:"Hostel A, 2nd, 214",pri:"Low",anon:0,by:"22K41A0501",at:n-DAY*9,status:"Submitted",asg:"Unassigned",ups:[],cm:[],fb:null},
{id:"MRU-1003",cat:"Safety / Harassment",dept:CATS["Safety / Harassment"],desc:"Senior students harassing juniors near the back gate after 9 pm.",loc:"Back gate",pri:"High",anon:1,by:"22K41A0533",at:n-DAY*.3,status:"Submitted",asg:"Unassigned",ups:["c"],cm:[],fb:null},
{id:"MRU-1004",cat:"IT / Wi-Fi",dept:CATS["IT / Wi-Fi"],desc:"Wi-Fi keeps disconnecting in the library.",loc:"Library, 1st",pri:"Medium",anon:0,by:"22K41A0501",at:n-DAY*5,status:"Resolved",asg:"Mr. Khan",ups:["a"],cm:[{by:"Mr. Khan",t:"Router replaced.",at:n-DAY*3}],fb:null,rat:n-DAY*3}]}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const now=()=>Date.now()+S.off*DAY,L=k=>(T[S.lang]||T.en)[k]||T.en[k]||k;
const ago=t=>{const d=(now()-t)/DAY;return d<1?Math.max(1,Math.round(d*24))+L("h"):Math.floor(d)+L("d")};
const nm=p=>Array.isArray(p)?p.map(x=>x[0]==="~"?L(x.slice(1)):x).join(" "):p;
const op=(v,s)=>v.map(x=>`<option value="${E(x)}" ${x===s?"selected":""}>${E(L(x))}</option>`).join("");
function log(who,act){const p=S.audit.length?S.audit[S.audit.length-1].h:"0",t=now();S.audit.push({t,who,act,h:H(p+t+who+act)})}
function toast(m){const d=document.createElement("div");d.textContent=m;$("#toast").appendChild(d);setTimeout(()=>d.remove(),3500)}
function note(...p){S.notes.unshift({t:now(),m:p});if(S.sms)toast("📱 "+L("SMS/WhatsApp (simulated)")+": "+nm(p))}
const sla=t=>({High:1,Medium:3,Low:7})[t.pri],pt=(id,n)=>S.pts[id]=(S.pts[id]||0)+n;
function escCheck(){S.tickets.forEach(t=>{if(t.status!=="Resolved"&&!t.esc&&(now()-t.at)/DAY>sla(t)){t.esc=1;log("System","Auto-escalated "+t.id);note(t.id,"~unresolved past deadline, escalated to admin")}})}
function login(id,role,dept){id=(id||"").trim();if(!/^[A-Za-z0-9]{8,12}$/.test(id)&&!/^[^@\s]+@[^@\s]+\.\w+$/.test(id))return toast(L("Enter a valid university ID (8 to 12 characters) or email"));
S.me={id,role,dept,name:role==="student"?id:role==="admin"?"Admin":"Staff, "+dept};tab=TABS[role][0];log(S.me.name,"Logged in");save();render()}
const demo=(r,d)=>login(r==="student"?"22K41A0501":r+"demo01",r,d);
function logout(){S.me=null;save();render()}
function keep(){if($("#c-desc"))draft={desc:$("#c-desc").value,cat:$("#c-cat").value,pri:$("#c-pri").value}}
function mine(){const m=S.me;return S.tickets.filter(t=>m.role==="student"?t.by===m.id:m.role==="staff"?t.dept===m.dept:1)}
const who=t=>t.anon?L("Anonymous"):t.by;
function sub(force){const d=$("#c-desc").value.trim(),cat=$("#c-cat").value;if(d.length<10)return toast(L("Please describe the issue in a few more words"));
const w=d.toLowerCase().match(/\w{4,}/g)||[],sim=S.tickets.filter(t=>t.status!=="Resolved"&&t.cat===cat&&w.filter(x=>t.desc.toLowerCase().includes(x)).length>=2);
if(sim.length&&!force){$("#dup").innerHTML=`<div class="cd"><b>${L("Similar open complaints found")}</b>`+sim.map(t=>`<div class="s">${t.id}: ${E(t.desc)} <button onclick="up('${t.id}')">${L("Me too")}</button></div>`).join("")+`<button class="p" onclick="sub(1)">${L("Submit anyway")}</button></div>`;return}
const f=$("#c-img").files[0],mk=img=>{const t={id:"MRU-"+S.n++,cat,dept:CATS[cat],desc:d,loc:[$("#c-blk").value,$("#c-flr").value,$("#c-room").value].filter(Boolean).join(", "),pri:$("#c-pri").value,anon:$("#c-anon").checked?1:0,by:S.me.id,at:now(),status:"Submitted",asg:"Unassigned",ups:[],cm:[],fb:null,img};
S.tickets.unshift(t);pt(S.me.id,10);log(t.anon?"Anonymous":S.me.id,"Filed "+t.id);note(t.id,"~routed to","~"+t.dept);draft={};tab="mine";save();render();toast(L("Submitted as")+" "+t.id+" (+10 "+L("points")+")")};
if(f&&f.size<3e5){const r=new FileReader();r.onload=()=>mk(r.result);r.readAsDataURL(f)}else mk(null)}
function up(id){const t=S.tickets.find(x=>x.id===id),u=S.me.id;if(t.ups.includes(u))return toast(L("Already added"));t.ups.push(u);pt(u,5);save();render()}
function setSt(id,v){const t=S.tickets.find(x=>x.id===id);t.status=v;if(v==="Resolved")t.rat=now();log(S.me.name,id+" status → "+v);note(id,"~is now","~"+v);save();render()}
function setAsg(id,v){const t=S.tickets.find(x=>x.id===id);t.asg=v;log(S.me.name,id+" assigned to "+v);save();render()}
function setDept(id,v){const t=S.tickets.find(x=>x.id===id);t.dept=v;log(S.me.name,id+" rerouted to "+v);save();render()}
function cmt(id){const i=$("#cm-"+id),v=i.value.trim();if(!v)return;S.tickets.find(x=>x.id===id).cm.push({by:S.me.role==="student"?"Student":(S.me.dept||"Admin"),t:v,at:now()});log(S.me.name,"Comment on "+id);note("~New comment on",id);save();render()}
function rate(id,n){S.tickets.find(x=>x.id===id).fb=n;pt(S.me.id,5);log(S.me.name,id+" rated "+n+"/5");save();render()}
function bot(){const v=$("#bot").value.toLowerCase();if(!v)return;let best="",sc=0;for(const c in KW){const n=KW[c].split(" ").filter(w=>v.includes(w)).length;if(n>sc){sc=n;best=c}}
const urg=URG.split(" ").some(w=>v.includes(w));draft={cat:best||"Infrastructure",desc:$("#bot").value,pri:urg?"High":"Medium"};render();toast(L("Suggested:")+" "+L(draft.cat)+", "+L(draft.pri))}
function dict(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast(L("Voice input is not supported in this browser"));const r=new R();r.lang={te:"te-IN",hi:"hi-IN"}[S.lang]||"en-IN";r.onresult=e=>{$("#c-desc").value+=" "+e.results[0][0].transcript};r.onerror=()=>toast(L("Could not capture voice"));r.start();toast(L("Listening…"))}
function csv(){const rows=[["ID","Category","Dept","Priority","Status","Location","Filed by","Description"]].concat(mine().map(t=>[t.id,t.cat,t.dept,t.pri,t.status,t.loc,t.anon?"Anonymous":t.by,t.desc]));
const s=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n"),bad=()=>toast(L("Clipboard blocked in this view"));try{navigator.clipboard.writeText(s).then(()=>toast(L("CSV copied. Paste into Excel or Sheets")),bad)}catch(e){bad()}}
const badge=p=>p>=60?"🏆 "+L("Champion"):p>=30?"⭐ "+L("Campus Helper"):p>=10?"🌱 "+L("Voice"):L("New");
function card(t,pub){const m=S.me,st=m.role!=="student"&&!pub,done=t.status==="Resolved";
return `<div class="cd"><div class="r" style="justify-content:space-between"><b>${t.id} · ${E(L(t.cat))}</b><span><span class="b ${t.pri}">${L(t.pri)}</span> <span class="b">${L(t.status)}</span>${t.esc?` <span class="b High">${L("Escalated")}</span>`:""}</span></div>
<div>${E(pub?t.desc.slice(0,90)+(t.desc.length>90?"…":""):t.desc)}</div><div class="s">${E(L(t.dept))} · ${E(t.loc||L("No location"))} · ${ago(t.at)} ${L("ago")}${pub?"":" · "+L("by")+" "+E(who(t))} · 👍 ${t.ups.length}</div>
${t.img&&!pub?`<img class="at" src="${t.img}" alt="">`:""}
<div class="r" style="margin-top:6px"><button onclick="up('${t.id}')">👍 ${L("Me too")}</button>
${st?`<select onchange="setSt('${t.id}',this.value)">${op(STS,t.status)}</select><select onchange="setAsg('${t.id}',this.value)">${op(STAFF,t.asg)}</select>`:""}
${st&&m.role==="admin"?`<select onchange="setDept('${t.id}',this.value)">${op(Object.values(CATS),t.dept)}</select>`:""}</div>
${pub?"":t.cm.map(c=>`<div class="cm"><b>${E(L(c.by))}</b>: ${E(c.t)}</div>`).join("")}
${pub?"":`<div class="r np" style="margin-top:6px"><input id="cm-${t.id}" placeholder="${L("Add a comment")}"><button onclick="cmt('${t.id}')" style="flex:0 0 auto">${L("Send")}</button></div>`}
${!pub&&done&&m.role==="student"?(t.fb?`<div class="s">${L("Your rating:")} ${"★".repeat(t.fb)}</div>`:`<div class="s">${L("Was it fixed properly?")} ${[1,2,3,4,5].map(n=>`<button onclick="rate('${t.id}',${n})">${n}★</button>`).join(" ")}</div>`):""}
${!pub&&t.fb&&m.role!=="student"?`<div class="s">${L("Student rating:")} ${"★".repeat(t.fb)}</div>`:""}</div>`}
function list(){const m=S.me;let a=mine().slice();const q=F.q.toLowerCase();a=a.filter(t=>(!F.st||t.status===F.st)&&(!F.cat||t.cat===F.cat)&&(!q||(t.desc+t.id+t.loc).toLowerCase().includes(q)));
const P={High:0,Medium:1,Low:2};a.sort((x,y)=>(y.esc||0)-(x.esc||0)||P[x.pri]-P[y.pri]||x.at-y.at);if(m.role==="student")a.sort((x,y)=>y.at-x.at);
$("#list").innerHTML=a.map(t=>card(t)).join("")||`<div class="s">${L("Nothing matches.")}</div>`}
function filters(){return `<div class="r np"><input placeholder="${L("Search…")}" value="${E(F.q)}" oninput="F.q=this.value;list()"><select onchange="F.st=this.value;list()"><option value="">${L("All statuses")}</option>${op(STS,F.st)}</select><select onchange="F.cat=this.value;list()"><option value="">${L("All categories")}</option>${op(Object.keys(CATS),F.cat)}</select></div><div id="list" style="margin-top:10px"></div>`}
function view(){const m=S.me,o=Object.keys(CATS);
if(tab==="file")return `<div class="cd"><b>🤖 ${L("Describe your problem")}</b><div class="s">${L("The assistant suggests a category and priority from your words.")}</div><div class="r"><input id="bot" placeholder="${L("e.g. no water in hostel toilet since morning")}"><button onclick="bot()" style="flex:0 0 auto">${L("Suggest")}</button></div></div>
<div class="cd"><label>${L("Category (auto-routes to the department)")}</label><select id="c-cat">${op(o,draft.cat)}</select>
<label>${L("Description")}</label><textarea id="c-desc" rows="4">${E(draft.desc||"")}</textarea><button onclick="dict()" class="np">🎤 ${L("Dictate")}</button>
<div class="r"><div><label>${L("Block")}</label><input id="c-blk"></div><div><label>${L("Floor")}</label><input id="c-flr"></div><div><label>${L("Room")}</label><input id="c-room"></div><div><label>${L("Priority")}</label><select id="c-pri">${op(PRI,draft.pri||"Medium")}</select></div></div>
<label>${L("Photo (under 300 KB)")}</label><input type="file" id="c-img" accept="image/*"><label><input type="checkbox" id="c-anon" style="width:auto"> ${L("File anonymously (hidden from staff and feed)")}</label>
<div id="dup"></div><p><button class="p" onclick="sub()">${L("submit")}</button></p></div>`;
if(tab==="mine"||tab==="queue"){const p=S.pts[m.id]||0;return (m.role==="student"?`<div class="cd">⭐ ${p} ${L("points")} · ${badge(p)}</div>`:"")+(m.role==="admin"?`<div class="r np"><button onclick="S.off+=3;escCheck();save();render()">⏩ ${L("Simulate +3 days")}</button><button onclick="csv()">${L("Copy CSV")}</button><button onclick="try{print()}catch(e){toast(L('Print blocked in this view'))}">${L("Export PDF")}</button></div>`:"")+filters()}
if(tab==="feed")return `<div class="s">${L("Public view: names and attachments are hidden.")}</div>`+S.tickets.map(t=>card(t,1)).join("");
if(tab==="faq")return [["How long until I get a reply?","High priority: 1 day, Medium: 3 days, Low: 7 days. After that the ticket auto-escalates to admin."],["Is anonymous filing really anonymous?","Staff, admin and the public feed never see your ID on anonymous tickets."],["Can I add proof?","Yes, attach a photo of up to 300 KB."],["What if someone already reported it?","Use Me too instead of filing a duplicate."]].map(x=>`<details class="cd"><summary><b>${L(x[0])}</b></summary>${L(x[1])}</details>`).join("");
if(tab==="stats"){const a=S.tickets,r=a.filter(t=>t.status==="Resolved"),mx=Math.max(1,...o.map(c=>a.filter(t=>t.cat===c).length)),fb=a.filter(t=>t.fb),avg=r.length?(r.reduce((s,t)=>s+(t.rat-t.at),0)/r.length/DAY).toFixed(1):"–";
return `<div class="r"><div class="cd">${L("Total")}<br><b>${a.length}</b></div><div class="cd">${L("Open")}<br><b>${a.length-r.length}</b></div><div class="cd">${L("Escalated")}<br><b>${a.filter(t=>t.esc).length}</b></div><div class="cd">${L("Avg resolution")}<br><b>${avg} ${L("d")}</b></div><div class="cd">${L("Avg rating")}<br><b>${fb.length?(fb.reduce((s,t)=>s+t.fb,0)/fb.length).toFixed(1):"–"}</b></div></div>
<div class="cd"><b>${L("Complaints by category")}</b>${o.map(c=>{const n=a.filter(t=>t.cat===c).length;return `<div class="s">${E(L(c))} (${n})</div><div class="bar" style="width:${n/mx*100}%"></div>`}).join("")}</div>`}
if(tab==="audit"){let p="0",ok=1;S.audit.forEach(e=>{if(H(p+e.t+e.who+e.act)!==e.h)ok=0;p=e.h});
return `<div class="cd">${ok?"✅ "+L("Hash chain verified: no entry has been altered"):"⚠️ "+L("Chain broken")} <span class="s">(${L("each entry hashes the previous one, a lightweight blockchain-style seal")})</span></div>`+S.audit.slice().reverse().map(e=>`<div class="s">${new Date(e.t).toLocaleString()} · ${E(e.who)} · ${E(e.act)} · #${e.h}</div>`).join("")}}
function render(){escCheck();const m=S.me,hd=$("#hd");document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;$("#ti").textContent="🎓 "+L("MRU Complaint Portal");
hd.innerHTML=`<select onchange="keep();S.lang=this.value;save();render()" style="flex:0 0 auto;width:auto">${[["en","English"],["te","తెలుగు"],["hi","हिन्दी"]].map(l=>`<option value="${l[0]}" ${S.lang===l[0]?"selected":""}>${l[1]}</option>`).join("")}</select>
<button onclick="S.theme=(S.theme==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme: dark)').matches))?'light':'dark';save();render()" style="flex:0 0 auto">🌓</button>`+
(m?`<label style="margin:0;flex:0 0 auto"><input type="checkbox" style="width:auto" ${S.sms?"checked":""} onchange="S.sms=this.checked?1:0;save()"> SMS</label><button onclick="showN=!showN;render()" style="flex:0 0 auto">🔔 ${S.notes.length}</button><button onclick="logout()" style="flex:0 0 auto">${L("Log out")}</button>`:"");
if(!m){$("#app").innerHTML=`<div class="cd" style="max-width:420px;margin:30px auto"><h2 style="margin-top:0">${L("Sign in")}</h2><label>${L("University ID or email")}</label><input id="lid" placeholder="22K41A0501"><label>${L("Role")}</label><select id="lrole" onchange="$('#ldept').style.display=this.value==='staff'?'block':'none'"><option value="student">${L("Student")}</option><option value="staff">${L("Department staff")}</option><option value="admin">${L("Admin")}</option></select>
<select id="ldept" style="display:none;margin-top:8px">${op(Object.values(CATS))}</select><p><button class="p" onclick="login($('#lid').value,$('#lrole').value,$('#ldept').value)">${L("Sign in")}</button></p>
<div class="s">${L("Quick demo:")}</div><div class="r"><button onclick="demo('student')">${L("Student")}</button><button onclick="demo('staff','Estate &amp; Maintenance')">${L("Staff")}</button><button onclick="demo('admin')">${L("Admin")}</button></div></div>`;return}
$("#app").innerHTML=(showN?`<div class="cd np"><b>${L("Notifications")}</b>${S.notes.slice(0,8).map(n=>`<div class="s">${ago(n.t)} ${L("ago")} · ${E(nm(n.m))}</div>`).join("")||`<div class="s">${L("None yet")}</div>`}</div>`:"")+
`<nav class="np">${TABS[m.role].map(x=>`<button class="${tab===x?"on":""}" onclick="tab='${x}';render()">${L(x)}</button>`).join("")}</nav>`+view();if($("#list"))list()}
render();
</script></body></html>
